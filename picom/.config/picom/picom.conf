#################################
#           基础渲染设置         #
#################################
# 使用 glx 后端通常是最快的，但需要正确配置
backend = "glx";

# 垂直同步，防止画面撕裂 (如果是 NVIDIA 闭源驱动，建议设为 true)
vsync = true;
# 使用损伤区域重绘 (只重绘变动部分)，大幅降低 GPU 占用
use-damage = true;
# 【重要】禁用全屏重定向优化
# 虽然设为 true 可以提升全屏游戏性能，但在很多环境下会导致画面卡死或崩溃
# 为了稳定，建议设为 false
unredir-if-possible = false;

# 检测窗口的各种属性
detect-transient = true;
detect-client-leader = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

#################################
#           圆角 (Corner)       #
#################################
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'i3bar'",
    "class_g = 'Dunst'",       # 通知栏不要圆角
    "class_g = 'Rofi'",        # Rofi 自带圆角，避免双重圆角
    "class_g = 'fcitx'",
    "window_type = 'tooltip'",
    "window_type = 'menu'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'"
];

#################################
#           透明度 (Opacity)    #
#################################
active-opacity = 0.98;         # 建议不要设为 1.0，稍微低一点可以触发模糊
inactive-opacity = 0.92;       # 非活动窗口透明度
frame-opacity = 1.0;           # 边框不透明
inactive-opacity-override = false;

opacity-rule = [
    # 视频和设计工具不透明
    "100:class_g = 'mpv'",
    "100:class_g = 'obs'",
    "100:class_g = 'Gimp'",
    "100:class_g = 'Inkscape'",
    
    # 浏览器全屏时不透明 (防止视频撕裂)
    "100:class_g *= 'Chrome' && _NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
    "100:class_g *= 'Firefox' && _NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",

    # 特殊窗口处理
    "100:WM_NAME@:s = '画中画'",
    "100:class_g = 'Rofi'",    # 启动器不透明
    "100:class_g = 'Dunst'",   # 通知不透明
    
    # 画中画/置顶窗口不透明
    "100:_NET_WM_STATE@:32a *= '_NET_WM_STATE_STICKY'"
];

#################################
#           背景模糊 (Blur)      #
#################################
# Dual_kawase 是最高效的模糊算法，但需要 GPU 支持
blur-method = "dual_kawase";
blur-strength = 6;             # 强度不要太高，9 有点费资源，6-7 比较平衡
blur-kern = "3x3box";

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'i3bar'",
    "class_g = 'Rofi'",  
    # 【关键】截图工具必须排除，否则截图时会卡死或全屏模糊
    "class_g = 'slop'",        # maim 的底层选择框
    "class_g = 'maim'",
    "class_g = 'flameshot'",
    "class_g = 'Microsoft-edge'",
    
    # 输入法和菜单
    "class_g = 'fcitx'",
    "class_g = 'fcitx5'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'",
    
    # 微信等特定软件
    "_NET_WM_NAME@:s *= 'wechat'",
    "class_g *= 'wemeetapp'",
    
    # 排除 GTK 窗口边框阴影
    "_GTK_FRAME_EXTENTS@:c"
];

#################################
#           淡入淡出 (Fading)    #
#################################
fading = true;
fade-in-step = 0.03;           # 调大一点，0.01 太慢了感觉像卡顿
fade-out-step = 0.03;
fade-delta = 4;                # 每一帧的时间间隔
fade-exclude = [
    "class_g = 'Slop'",        # 截图时不要淡入淡出
    "class_g = 'Rofi'",
    "class_g = 'fcitx'"
];

#################################
#           动画 (Animations)   #
#################################
# ⚠️ 警告：以下设置仅适用于 pijulius/picom 分支
# 如果你使用的是官方 yshui/picom，请将下面这块全部注释掉，否则无法启动！
# 如果你确定装的是 pijulius 版，取消注释即可。

# animations = true;
# animation-stiffness = 200;
# animation-window-mass = 0.4;
# animation-dampening = 20;
# animation-clamping = false;
# animation-for-open-window = "zoom";
# animation-for-unmap-window = "squeeze";
# animation-for-transient-window = "slide-up"; 
# animation-exclude = [
#     "class_g = 'fcitx'",
#     "class_g = 'flameshot'",
#     "class_g = 'Dunst'",
#     "class_g = 'Rofi'",
#     "window_type = 'dock'",
#     "class_g = 'slop'"
# ];

#################################
#           杂项设置            #
#################################
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.9; }
  dropdown_menu = { opacity = 0.9; }
};

# ============================================
# libinput-gestures 配置文件 (i3wm 专用)
# 语法: gesture <动作> <方向> <手指数量> <命令>
# ============================================

# --- 3 指左右滑动：切换工作区 ---
# 对应 i3 的 workspace next/prev
gesture swipe left 3  i3-msg workspace next
gesture swipe right 3 i3-msg workspace prev

# --- 3 指上滑：全屏切换 ---
# 对应你 config.bak 里的 $mod+f
gesture swipe up 3    i3-msg fullscreen toggle

# --- 3 指下滑：隐藏/显示浮动窗口 或者 回到平铺 ---
# 这里映射为 floating toggle ($mod+Shift+f)
gesture swipe down 3  i3-msg floating toggle

# --- 4 指上滑：打开 Rofi (程序启动器) ---
# 模拟按下 Super+d
gesture swipe up 4    xdotool key super+d

# --- 4 指下滑：关闭当前窗口 ---
# 模拟按下 Super+Shift+q
gesture swipe down 4  xdotool key super+shift+q

# --- 缩放手势 (捏合) ---
# 模拟浏览器的放大/缩小 (Ctrl + / Ctrl -)
gesture pinch in 2    xdotool key ctrl+minus
gesture pinch out 2   xdotool key ctrl+plus


; ============================================================
;  Polybar Config - Underline Style (Catppuccin Mocha)
; ============================================================

[colors]
; Catppuccin Mocha Palette
base = #CC1e1e2e
mantle = #181825
crust = #11111b
text = #cdd6f4
subtext0 = #a6adc8
subtext1 = #bac2de
surface0 = #313244
surface1 = #45475a
surface2 = #585b70
overlay0 = #6c7086
overlay1 = #7f849c
overlay2 = #9399b2
blue = #89b4fa
lavender = #b4befe
sapphire = #74c7ec
sky = #89dceb
teal = #94e2d5
green = #a6e3a1
yellow = #f9e2af
peach = #fab387
maroon = #eba0ac
red = #f38ba8
mauve = #cba6f7
pink = #f5c2e7
flamingo = #f2cdcd
rosewater = #f5e0dc
transparent = #000000

[bar/main]
width = 100%
height = 24pt
; 圆角
radius = 5
; 状态栏整体背景
background = ${colors.base}
foreground = ${colors.text}

; === 核心修改 1: 启用下划线 ===
; 将 line-size 设置为 3 (像素)，否则下划线不显示
line-size = 6
; 框边缘间隙
border-size = 3

; 恢复默认的内边距，因为不再是贴边的色块了
padding-left = 1
padding-right = 1
module-margin = 0

font-0 = "Maple Mono NF CN:size=13;2"
font-1 = "Maple Mono NF CN:style=Bold:size=13;2"
font-2 = "Source Han Sans SC:style=Regular:size=11;2"
font-3 = "Font Awesome 6 Free:style=Solid:size=10;2"

modules-left = i3
modules-center = date
modules-right = tray powermenu

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; ============================================================
;  MODULE: i3 Workspaces (下划线风格)
; ============================================================

[module/i3]
type = internal/i3

pin-workspaces = true
strip-wsnumbers = true
index-sort = true

; ws-icon-0 = 1;〇
; ws-icon-1 = 2;〡
; ws-icon-2 = 3;〢
; ws-icon-3 = 4;〣
; ws-icon-4 = 5;〤
; ws-icon-5 = 6;〥
; ws-icon-6 = 7;〦
; ws-icon-7 = 8;〧
; ws-icon-8 = 9;〨
; ws-icon-9 = 10;〩
ws-icon-0 = 1;1
ws-icon-1 = 2;2
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = 5;5
ws-icon-5 = 6;6
ws-icon-6 = 7;7
ws-icon-7 = 8;8
ws-icon-8 = 9;9
ws-icon-9 = 10;0
ws-icon-default = 

; 加入 <label-mode> 以显示 resize 等模式提示
format = <label-state> <label-mode>

format-background = ${colors.base}
format-padding = 0

; === 核心修改 2: 选中状态改为下划线风格 ===
label-focused = %icon%
; 前景色改为高亮色 (淡紫色)
label-focused-foreground = ${colors.mauve}
; 背景色改为基础底色 (看起来像透明)
label-focused-background = ${colors.base}
; 添加下划线 (淡紫色)
label-focused-underline = ${colors.mauve}
; 保持内边距
label-focused-padding = 1
; 保持加粗
label-focused-font = 5

; --- 未选中状态 (保持不变) ---
label-unfocused = %icon%
label-unfocused-foreground = ${colors.overlay0}
label-unfocused-background = ${colors.base}
label-unfocused-padding = 1

; --- 可见但未聚焦状态 (多显示器时使用) ---
label-visible = %icon%
label-visible-foreground = ${colors.text}
label-visible-background = ${colors.base}
label-visible-padding = 1

; --- 紧急状态 ---
label-urgent = 
label-urgent-foreground = ${colors.base}
label-urgent-background = ${colors.red}
label-urgent-padding = 1
; 定义模式提示的样式 (红色背景警告保持不变)
label-mode = %mode%
label-mode-background = ${colors.red}
label-mode-foreground = ${colors.base}
label-mode-padding = 1
label-mode-font = 2

; ============================================================
;  MODULE: Date
; ============================================================
[module/date]
type = internal/date
interval = 1
locale = zh_CN.UTF-8

date = %A %p %I:%M

label = %date%
label-foreground = ${colors.text}
label-background = ${colors.base}
label-font = 2

; ============================================================
;  MODULE: System Tray
; ============================================================
[module/tray]
type = internal/tray

format-background = ${colors.base}
tray-background = ${colors.base}
tray-foreground = ${colors.text}

tray-spacing = 8px
tray-size = 66%
format-padding = 0

[module/powermenu]
type = custom/text

; 图标设置：
; 如果你想用 Font Awesome (你配置中已有的 font-3)，使用 
; 如果你想用 Feather 字体 (脚本默认图标)，使用 
content = ""

content-foreground = ${colors.red}
content-background = ${colors.base}
content-padding = 1

; 点击左键运行你的关机脚本
click-left = /home/loong/.config/rofi/powermenu/type-2/powermenu.sh

; 可选：悬停效果，增加下划线以匹配你的 i3 模块风格
content-hover-underline = ${colors.red}
cursor-click = pointer
